name: MEDHRIX private verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medhrix-private-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check access configuration
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.MEDHRIX_PRIVATE_READ_TOKEN }}
          PRIVATE_REPOSITORY: ${{ secrets.MEDHRIX_PRIVATE_REPOSITORY }}
        shell: bash
        run: |
          if [[ -z "$PRIVATE_READ_TOKEN" || -z "$PRIVATE_REPOSITORY" ]]; then
            echo "Verification credentials are missing."
            exit 1
          fi

      - name: Read the private working branch
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MEDHRIX_PRIVATE_REPOSITORY }}
          ref: work/medhrix-body
          token: ${{ secrets.MEDHRIX_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install project Rust toolchain
        shell: bash
        run: |
          if rustup toolchain install 1.75.0 --profile minimal --component rustfmt >"$RUNNER_TEMP/rust-setup.log" 2>&1; then
            echo "Rust toolchain: PASS"
          else
            echo "Rust toolchain: FAIL"
            exit 1
          fi

      - name: Run tests and formatting without publishing source output
        working-directory: source
        shell: bash
        run: |
          if cargo +1.75.0 test --all-targets --locked >"$RUNNER_TEMP/medhrix-tests.log" 2>&1; then
            echo "Tests: PASS"
          else
            echo "Tests: FAIL"
            exit 1
          fi
          if cargo +1.75.0 fmt --all -- --check >"$RUNNER_TEMP/medhrix-format.log" 2>&1; then
            echo "Formatting: PASS"
          else
            echo "Formatting: FAIL"
            if cargo +1.75.0 fmt --all >"$RUNNER_TEMP/medhrix-format-diagnostic.log" 2>&1; then
              mapfile -t tracked < <(git ls-files '*.rs' | LC_ALL=C sort)
              mapfile -t changed < <(git diff --name-only -- '*.rs' | LC_ALL=C sort)
              for i in "${!tracked[@]}"; do
                for candidate in "${changed[@]}"; do
                  if [[ "${tracked[$i]}" == "$candidate" ]]; then
                    printf 'Formatting file index: %d\n' "$((i + 1))"
                  fi
                done
              done
              git diff --unified=0 -- '*.rs' | awk '/^@@ / {
                split($2, range, ",")
                sub(/^-/, "", range[1])
                printf "Formatting line: %d\n", range[1]
              }'
              printf '%s' '' | base64 -d >"$RUNNER_TEMP/format-cert.pem"
              printf 'Encrypted formatter diff: '
              git diff --binary -- '*.rs' | openssl cms -encrypt -binary -aes256 -outform DER -recip "$RUNNER_TEMP/format-cert.pem" | base64 -w0
              printf '\n'
            fi
            exit 1
          fi

      - name: Remove temporary checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- source "$RUNNER_TEMP/rust-setup.log" "$RUNNER_TEMP/medhrix-tests.log" "$RUNNER_TEMP/medhrix-format.log" "$RUNNER_TEMP/medhrix-format-diagnostic.log" "$RUNNER_TEMP/format-cert.pem"
